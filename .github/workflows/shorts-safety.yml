name: Shorts quality safety
on:
  pull_request:
    paths:
      - "scripts/flow_shorts_review.py"
      - "scripts/shorts_audio_qc.py"
      - "tests/test_*shorts*.py"
      - "voiceover.py"
      - "assemble_video.py"
      - "youtube_uploader.py"
      - ".github/workflows/shorts-safety.yml"
  push:
    branches:
      - "fix/shorts-quality-*"
    paths:
      - "scripts/flow_shorts_review.py"
      - "scripts/shorts_audio_qc.py"
      - "tests/test_*shorts*.py"
      - "voiceover.py"
      - "assemble_video.py"
      - "youtube_uploader.py"
      - ".github/workflows/shorts-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free local test dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy
          ffmpeg -version
      - name: Run Shorts quality and safety tests (no cloud APIs)
        run: |
          python -m unittest discover -s tests -p 'test_*shorts*.py' -v
      - name: No publishing, uploads or credentials required
        run: |
          echo "Tests use only local generated fixtures; no Google Flow credits or YouTube upload."
