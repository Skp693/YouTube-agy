name: Media quality safety tests

on:
  push:
    branches: ["fix/fail-fast-media-quality-20261106"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert production fails without actual media tools
        run: python -m unittest discover -s tests -p 'test_quality_gates.py' -v
